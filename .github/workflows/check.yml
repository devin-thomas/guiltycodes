name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Compiler, style and public fixture tests
        run: npm run check
      - name: Private-source integration scope
        run: echo "::notice::The full catalog build uses private research inputs and is checked locally before publication. This public CI job checks the compiler, style and self-contained fixtures."
