# Publishes the committed pnach/ files as a GitHub release when a vYYYY.MM.DD tag is pushed.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the cheat files
        run: |
          ls pnach/*.pnach > /dev/null || { echo "pnach/ has no .pnach files"; exit 1; }
          cd pnach && zip -X ../guiltycodes-pnach.zip *.pnach
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'PCSX2 PNACH files for the Guilty Gear PS2 games. Select one complete feature module and rename it SERIAL_CRC.pnach using its release identity below. In PCSX2 choose Tools > Open Data Directory, put the file in patches, and enable its named sections in game Properties > Patches.'
            echo
            echo 'Legacy release cheat files use cheats and Properties > Cheats > Enable Cheats. The ZIP contains alternatives; do not enable every module together. Full placement instructions: https://guiltycodes.pages.dev/how-to/'
            echo
            echo "| File | Game | Release | Serial | CRC | Feature pages | Patch sections |"
            echo "|---|---|---|---|---|---|---|---|"
            jq -r '.[] | "| \(.file) | \(.game) | \(.release) | \(.serial) | \(.crc) | \(.featurePages) | \(.patchSections) |"' pnach/index.json
            echo
            echo "Every code with its test status: https://guiltycodes.pages.dev/downloads/"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "Guilty Codes $GITHUB_REF_NAME" --notes-file notes.md guiltycodes-pnach.zip pnach/*.pnach
